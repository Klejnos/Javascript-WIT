<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 49</title>
</head>
<body style="color: red; font-size: 50px;">
    <script>
        let liczba_kle, n_kle, silnia_kle = 1;
        do{
            liczba_kle = prompt("Podaj n","");
            n_kle = parseFloat(liczba_kle);
        } while(n_kle<0);
        
        if(n_kle==0){
            document.write(1);
        }
        else{
            for(i=1; i<=n_kle; i++){
                silnia_kle *= i;
            }
            document.write("Silnia = " + silnia_kle);
        } 
    </script>
</body>
</html>
