<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Zadanie 43</title>
    </head>
    <body>
        <script>
            let x = parseInt(prompt("Podaj liczbę całkowitą", ""));
            for(i=1; i<=x; i++){
                if(i%2==0){
                    document.write(i + "<br>");
                }
            }
        </script>
    </body>
</html>
