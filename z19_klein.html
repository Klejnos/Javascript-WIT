<html> 
 <head> 
  <meta charset="UTF-8"> 
  <title>Zadanie 19</title>
  <link rel="stylesheet" href="styl.css"> 
 </head> 
<body> 
 <script type="text/javascript"> 
  function pole_kle() 
   { 
 var a_kle= parseFloat(document.getElementById('dlugosc').value); 
 var b_kle= a_kle*a_kle; 
        document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_kle.toFixed(2)+" cm^2";  
   } 
  function obwod_kle() 
   { 
 var a_kle= parseFloat(document.getElementById('dlugosc').value); 
 var b_kle= 4*a_kle; 
        document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_kle.toFixed(2)+" cm";  
   } 
 </script> 
  <h1>Wszystko o KWADRACIE</h1><br><br> 
  Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br> 
  <input type="button" name="pole" value="Oblicz pole" Onclick="pole_kle()"><br><br> 
  <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_kle()"><br><br> 
  <div  style="color:red;font-size:50px;"id="nazwa"></div> 
</body> 
</html>
