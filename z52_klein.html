<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 52</title>
</head>
<body>
    <script>
        let a_kle = 6;
        let b_kle = 25;

        for(i_kle=0; i_kle<b_kle; i_kle++){
            document.write("*");
        }
        document.write("<br>");
        for(i_kle=0; i_kle<(a_kle - 2); i_kle++){
            document.write("*&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;*<br>");
        }
        for(i_kle=0; i_kle<b_kle; i_kle++){
            document.write("*");
        }
    </script>
</body>
</html>
