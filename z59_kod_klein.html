    <body><center>
        <h1>Kod do zadania 59</h1>
        <textarea rows="16" cols="80" readonly><!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 59</title>
</head>
<body>
    <script language="JavaScript">
        var R_kle = parseFloat(prompt("Podaj promień R:"));
        
        var R_calkowite_kle = Math.floor(R_kle);
        var N_kle = 0;
        
        var x_min_kle = Math.floor(-R_kle - 1);
        var x_max_kle = Math.floor(R_kle + 1);
        var y_min_kle = Math.floor(-R_kle - 1);
        var y_max_kle = Math.floor(R_kle + 1);
        
        for(var i_kle = x_min_kle; i_kle <= x_max_kle; i_kle++) {
            for(var j_kle = y_min_kle; j_kle <= y_max_kle; j_kle++) {
                var odleglosc_kle = Math.sqrt(i_kle * i_kle + j_kle * j_kle);
                if(odleglosc_kle <= R_kle) {
                    N_kle++;
                }
            }
        }
        
        document.write("Promień koła R = " + R_kle.toFixed(2) + "<br>");
        document.write("Liczba punktów kratowych N(R) = " + N_kle);
    </script>
</body>
